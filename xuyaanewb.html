<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xuyaanew - Berbagi Momen</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#2563EB',
                            cyan: '#06B6D4',
                            dark: '#0F172A',
                            black: '#020617'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes heartPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .animate-heart { animation: heartPulse 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen transition-colors duration-200">

    <!-- AUTHENTICATION CONTAINER (LOGIN / REGISTER) -->
    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-blue-950 to-black text-white">
        <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl p-8 rounded-2xl border border-blue-500/30 shadow-[0_0_50px_rgba(37,99,235,0.2)] space-y-6">
            
            <!-- Branding Logo -->
            <div class="text-center space-y-2">
                <h1 class="text-4xl font-bold font-sans tracking-wider bg-gradient-to-r from-blue-400 via-cyan-300 to-white bg-clip-text text-transparent drop-shadow">
                    Xuyaanew
                </h1>
                <p class="text-sm text-slate-300">Bagikan momen indahmu ke seluruh dunia.</p>
            </div>

            <!-- Auth Form Switcher -->
            <div class="flex border-b border-slate-700 text-center font-semibold text-sm">
                <button id="tab-btn-login" onclick="switchAuthTab('login')" class="w-1/2 py-2 border-b-2 border-blue-500 text-blue-400 transition">Masuk</button>
                <button id="tab-btn-register" onclick="switchAuthTab('register')" class="w-1/2 py-2 border-b-2 border-transparent text-slate-400 transition hover:text-white">Daftar Akun</button>
            </div>

            <!-- Error Message Box -->
            <div id="auth-error" class="hidden p-3 bg-red-500/20 border border-red-500/50 rounded-xl text-red-200 text-xs text-center"></div>

            <!-- FORM 1: LOGIN -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">Username</label>
                    <input type="text" id="login-username" required placeholder="Masukkan username" class="w-full p-3 rounded-xl bg-slate-950/60 border border-slate-700 text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">Kata Sandi</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full p-3 rounded-xl bg-slate-950/60 border border-slate-700 text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" id="btn-submit-login" class="w-full py-3 bg-gradient-to-r from-blue-600 via-cyan-600 to-blue-500 hover:from-blue-500 hover:to-cyan-500 rounded-xl font-bold text-sm shadow-lg shadow-blue-500/30 transition transform active:scale-95 text-white flex items-center justify-center space-x-2">
                    <span id="btn-login-text">Masuk</span>
                </button>
            </form>

            <!-- FORM 2: REGISTER -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">Nama Lengkap</label>
                    <input type="text" id="reg-fullname" required placeholder="Nama Anda" class="w-full p-3 rounded-xl bg-slate-950/60 border border-slate-700 text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">Username</label>
                    <input type="text" id="reg-username" required placeholder="username_unik" class="w-full p-3 rounded-xl bg-slate-950/60 border border-slate-700 text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">Kata Sandi</label>
                    <input type="password" id="reg-password" required placeholder="Minimal 4 karakter" minlength="4" class="w-full p-3 rounded-xl bg-slate-950/60 border border-slate-700 text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" id="btn-submit-register" class="w-full py-3 bg-gradient-to-r from-blue-600 via-cyan-600 to-blue-500 hover:from-blue-500 hover:to-cyan-500 rounded-xl font-bold text-sm shadow-lg shadow-blue-500/30 transition transform active:scale-95 text-white flex items-center justify-center space-x-2">
                    <span id="btn-register-text">Buat Akun Baru</span>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APPLICATION CONTAINER -->
    <div id="app" class="hidden min-h-screen flex-col md:flex-row max-w-7xl mx-auto bg-slate-950">

        <!-- SIDEBAR NAVIGATION (DESKTOP) -->
        <aside class="hidden md:flex flex-col justify-between w-64 p-6 border-r border-slate-800 sticky top-0 h-screen bg-slate-950">
            <div class="space-y-8">
                <!-- App Title -->
                <h1 class="text-2xl font-bold font-sans bg-gradient-to-r from-blue-400 via-cyan-300 to-white bg-clip-text text-transparent px-2">
                    Xuyaanew
                </h1>

                <!-- Nav Items -->
                <nav class="space-y-2">
                    <button onclick="switchTab('feed')" class="flex items-center space-x-4 w-full p-3 rounded-xl hover:bg-slate-900 font-semibold text-sm transition text-slate-200 hover:text-white">
                        <i class="fa-solid fa-house text-lg text-blue-400"></i>
                        <span>Beranda</span>
                    </button>
                    <button onclick="switchTab('search')" class="flex items-center space-x-4 w-full p-3 rounded-xl hover:bg-slate-900 font-semibold text-sm transition text-slate-200 hover:text-white">
                        <i class="fa-solid fa-magnifying-glass text-lg text-blue-400"></i>
                        <span>Cari</span>
                    </button>
                    <button onclick="openCreatePostModal()" class="flex items-center space-x-4 w-full p-3 rounded-xl hover:bg-slate-900 font-semibold text-sm transition text-slate-200 hover:text-white">
                        <i class="fa-regular fa-square-plus text-lg text-cyan-400"></i>
                        <span>Buat Post</span>
                    </button>
                    <button onclick="switchTab('profile')" class="flex items-center space-x-4 w-full p-3 rounded-xl hover:bg-slate-900 font-semibold text-sm transition text-slate-200 hover:text-white">
                        <img id="nav-user-avatar" src="" class="w-6 h-6 rounded-full object-cover border border-blue-500" alt="Avatar">
                        <span>Profil Saya</span>
                    </button>
                </nav>
            </div>

            <!-- Bottom Actions (Theme & Logout) -->
            <div class="space-y-2 pt-4 border-t border-slate-800">
                <button onclick="handleLogout()" class="flex items-center space-x-4 w-full p-3 rounded-xl hover:bg-red-950/30 text-red-400 font-semibold text-sm transition">
                    <i class="fa-solid fa-right-from-bracket text-lg"></i>
                    <span>Keluar</span>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 pb-16 md:pb-0 min-h-screen bg-slate-900/50">

            <!-- TAB 1: FEED -->
            <section id="tab-feed" class="max-w-xl mx-auto p-4 space-y-6">

                <!-- STORIES CAROUSEL -->
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex items-center space-x-4 overflow-x-auto no-scrollbar shadow-lg shadow-blue-950/20" id="stories-container">
                    <!-- Dynamic Stories Loaded Here -->
                </div>

                <!-- POSTS FEED CONTAINER -->
                <div id="posts-container" class="space-y-6">
                    <!-- Dynamic Posts Loaded Here -->
                </div>
            </section>

            <!-- TAB 2: SEARCH -->
            <section id="tab-search" class="hidden max-w-xl mx-auto p-4 space-y-4">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="text" placeholder="Cari postingan atau pengguna..." class="w-full pl-11 pr-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-white placeholder-slate-400">
                </div>
                <div class="p-8 text-center text-slate-400">
                    <i class="fa-solid fa-compass text-4xl mb-2 text-blue-400"></i>
                    <p class="text-sm">Jelajahi foto dan tren terbaru di Xuyaanew.</p>
                </div>
            </section>

            <!-- TAB 3: PROFILE -->
        <section id="tab-profile" class="hidden max-w-2xl mx-auto p-4 space-y-6">

            <!-- PROFILE COVER / WALLPAPER & OVERLAPPING AVATAR (DISCORD STYLE) -->
            <div class="relative w-full rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 shadow-xl pb-4">
                <!-- Wallpaper Banner -->
                <div class="relative w-full h-44 md:h-52 bg-gradient-to-r from-blue-900 via-cyan-950 to-slate-900 overflow-hidden">
                    <img id="profile-wallpaper" src="" class="w-full h-full object-cover hidden" alt="Wallpaper">
                    <button onclick="openEditProfileModal()" class="absolute top-3 right-3 bg-slate-950/80 backdrop-blur-md hover:bg-slate-900 text-white px-3 py-1.5 rounded-xl text-xs font-semibold border border-blue-500/30 flex items-center space-x-1.5 transition z-20">
                        <i class="fa-solid fa-pen-to-square text-blue-400"></i>
                        <span>Edit Profil</span>
                    </button>
                </div>

                <!-- Profile Info Box with Overlapping Avatar -->
                <div class="px-6 relative space-y-4">
                    <!-- Overlapping Avatar (Half inside banner, half below) -->
                    <div class="flex justify-between items-end">
                        <div class="-mt-14 relative z-10">
                            <img id="profile-user-avatar" class="w-24 h-24 md:w-28 md:h-28 rounded-full object-cover border-4 border-slate-950 shadow-2xl bg-slate-900" src="" alt="Profile Avatar">
                        </div>
                    </div>
                
                    <div class="space-y-2 pt-1">
                        <div>
                            <div class="flex items-center space-x-2">
                                <h2 id="profile-fullname" class="text-xl font-bold text-white"></h2>
                                <i id="profile-verified-icon" class="fa-solid fa-circle-check text-blue-500 text-lg hidden" title="Akun Terverifikasi"></i>
                            </div>
                            <div class="flex items-center space-x-2">
                                <p id="profile-username" class="text-sm text-cyan-400"></p>
                                <span id="profile-badge" class="hidden px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-wider bg-blue-600/20 text-blue-400 border border-blue-500/40 rounded-md"></span>
                            </div>
                        </div>
                        
                        <div class="flex space-x-6 text-sm pt-1">
                            <div><strong id="profile-posts-count" class="text-white">0</strong> <span class="text-slate-400">postingan</span></div>
                            <div><strong id="profile-followers-count" class="text-white">0</strong> <span class="text-slate-400">pengikut</span></div>
                            <div><strong id="profile-following-count" class="text-white">0</strong> <span class="text-slate-400">mengikuti</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PROFILE POSTS GRID -->
            <div id="profile-posts-grid" class="grid grid-cols-3 gap-1.5 rounded-xl overflow-hidden">
                <!-- Dynamic Profile Grid Items -->
            </div>
        </section>

        <!-- TAB 4: USER PROFILE VIEW (FOR FOLLOWING/EXPLORING OTHER USERS) -->
        <section id="tab-user-detail" class="hidden max-w-2xl mx-auto p-4 space-y-6">
            <div class="flex items-center space-x-3 pb-2">
                <button onclick="switchTab('feed')" class="p-2 rounded-xl bg-slate-900 text-slate-300 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button>
                <span class="text-sm font-semibold text-white">Profil Pengguna</span>
            </div>

            <div class="relative w-full rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 shadow-xl pb-4">
                <div class="relative w-full h-44 md:h-52 bg-gradient-to-r from-blue-900 via-cyan-950 to-slate-900 overflow-hidden">
                    <img id="detail-wallpaper" src="" class="w-full h-full object-cover hidden" alt="Wallpaper">
                </div>

                <div class="px-6 relative space-y-4">
                    <div class="flex justify-between items-end">
                        <div class="-mt-14 relative z-10">
                            <img id="detail-user-avatar" class="w-24 h-24 md:w-28 md:h-28 rounded-full object-cover border-4 border-slate-950 shadow-2xl bg-slate-900" src="" alt="Avatar">
                        </div>
                        <div class="pt-2">
                            <button id="detail-follow-btn" onclick="" class="px-5 py-2 rounded-xl font-bold text-xs shadow-md transition">Ikuti</button>
                        </div>
                    </div>
                
                    <div class="space-y-2 pt-1">
                        <div>
                            <div class="flex items-center space-x-2">
                                <h2 id="detail-fullname" class="text-xl font-bold text-white"></h2>
                                <i id="detail-verified-icon" class="fa-solid fa-circle-check text-blue-500 text-lg hidden"></i>
                            </div>
                            <div class="flex items-center space-x-2">
                                <p id="detail-username" class="text-sm text-cyan-400"></p>
                                <span id="detail-badge" class="hidden px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-wider bg-blue-600/20 text-blue-400 border border-blue-500/40 rounded-md"></span>
                            </div>
                        </div>
                        
                        <div class="flex space-x-6 text-sm pt-1">
                            <div><strong id="detail-posts-count" class="text-white">0</strong> <span class="text-slate-400">postingan</span></div>
                            <div><strong id="detail-followers-count" class="text-white">0</strong> <span class="text-slate-400">pengikut</span></div>
                            <div><strong id="detail-following-count" class="text-white">0</strong> <span class="text-slate-400">mengikuti</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="detail-posts-grid" class="grid grid-cols-3 gap-1.5 rounded-xl overflow-hidden"></div>
        </section>
    </main>

    <!-- MOBILE BOTTOM NAVIGATION BAR -->
        <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-950/95 backdrop-blur-md border-t border-slate-800 flex justify-around p-3 z-40 text-slate-300">
            <button onclick="switchTab('feed')" class="text-xl hover:text-blue-400"><i class="fa-solid fa-house"></i></button>
            <button onclick="switchTab('search')" class="text-xl hover:text-blue-400"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button onclick="openCreatePostModal()" class="text-xl text-cyan-400"><i class="fa-regular fa-square-plus"></i></button>
            <button onclick="switchTab('profile')" class="text-xl">
                <img id="mob-nav-avatar" src="" class="w-6 h-6 rounded-full object-cover border border-blue-400" alt="Avatar">
            </button>
        </nav>
    </div>

    <!-- CREATE POST MODAL -->
    <div id="modal-create-post" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-950 w-full max-w-lg rounded-2xl border border-blue-500/30 overflow-hidden shadow-2xl shadow-blue-900/30">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                <h3 class="font-bold text-base text-white">Buat Postingan Baru</h3>
                <button onclick="closeCreatePostModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="form-create-post" onsubmit="handleCreatePost(event)" class="p-4 space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">Pilih Jenis Media</label>
                    <select id="post-media-type" onchange="toggleMediaInputType()" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-800 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500 mb-3">
                        <option value="image">Gambar / Foto</option>
                        <option value="video">Video</option>
                    </select>

                    <label class="block text-xs font-semibold mb-1 text-slate-300">Upload File (Foto/Video) Atau Masukkan URL</label>
                    <input type="file" id="post-file-input" accept="image/*,video/*" onchange="handleFileSelect(event)" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 mb-2">
                    <input type="url" id="post-media-url" oninput="handleUrlInput(event)" placeholder="Atau masukkan URL media (https://...)" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-800 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- PREVIEW CONTAINER -->
                <div id="post-media-preview-box" class="hidden w-full h-48 rounded-xl overflow-hidden bg-black border border-slate-800 flex items-center justify-center relative">
                    <img id="post-preview-img" src="" class="hidden w-full h-full object-cover">
                    <video id="post-preview-video" controls class="hidden w-full h-full object-contain"></video>
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">Keterangan / Caption</label>
                    <textarea id="post-caption" rows="3" required placeholder="Tulis caption postinganmu..." class="w-full p-3 rounded-xl bg-slate-900 border border-slate-800 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeCreatePostModal()" class="px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-900 text-slate-300">Batal</button>
                    <button type="submit" id="btn-submit-post" class="px-5 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-semibold text-sm shadow-md shadow-blue-500/30 transition flex items-center space-x-2">
                        <span id="btn-post-text">Bagikan</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- EDIT PROFILE MODAL -->
    <div id="modal-edit-profile" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-950 w-full max-w-lg rounded-2xl border border-blue-500/30 overflow-hidden shadow-2xl shadow-blue-900/30">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                <h3 class="font-bold text-base text-white">Edit Profil & Lencana</h3>
                <button onclick="closeEditProfileModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="form-edit-profile" onsubmit="handleUpdateProfile(event)" class="p-4 space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">Nama Lengkap</label>
                    <input type="text" id="edit-fullname" required class="w-full p-3 rounded-xl bg-slate-900 border border-slate-800 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- OPSI PENAMBAHAN BADGE DEVELOPER & CENTANG BIRU -->
                <div class="p-3 bg-slate-900/80 border border-slate-800 rounded-xl space-y-3">
                    <label class="block text-xs font-semibold text-cyan-400">Pengaturan Lencana Akun</label>
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-300 flex items-center space-x-1.5">
                            <i class="fa-solid fa-circle-check text-blue-400"></i>
                            <span>Aktifkan Centang Biru (Verified)</span>
                        </span>
                        <input type="checkbox" id="edit-is-verified" class="w-4 h-4 accent-blue-500 cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Gelar / Role Akun</label>
                        <select id="edit-user-badge" class="w-full p-2.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-white focus:outline-none focus:ring-1 focus:ring-blue-500">
                            <option value="">Tanpa Gelar</option>
                            <option value="Developer">Developer</option>
                            <option value="Creator">Creator</option>
                            <option value="VIP">VIP User</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">Foto Profil (Upload File atau URL)</label>
                    <input type="file" id="edit-avatar-file" accept="image/*" onchange="handleAvatarFileSelect(event)" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 mb-2">
                    <input type="url" id="edit-avatar-url" placeholder="Atau URL foto profil..." class="w-full p-3 rounded-xl bg-slate-900 border border-slate-800 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">Wallpaper / Banner Profil (Upload File atau URL)</label>
                    <input type="file" id="edit-wallpaper-file" accept="image/*" onchange="handleWallpaperFileSelect(event)" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500 mb-2">
                    <input type="url" id="edit-wallpaper-url" placeholder="Atau URL wallpaper banner..." class="w-full p-3 rounded-xl bg-slate-900 border border-slate-800 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeEditProfileModal()" class="px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-900 text-slate-300">Batal</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-semibold text-sm shadow-md shadow-blue-500/30 transition">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-16 md:bottom-5 right-5 bg-slate-950 border border-blue-500/30 text-white px-4 py-3 rounded-xl shadow-xl shadow-blue-950/50 z-50 flex items-center space-x-2 transition-all duration-300 opacity-0 pointer-events-none transform translate-y-2">
        <i class="fa-solid fa-circle-check text-cyan-400" id="toast-icon"></i>
        <span id="toast-message" class="text-sm">Notifikasi</span>
    </div>

    <!-- FIREBASE SDK & APP LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Window Attachments Defined Early to Prevent ReferenceErrors
        window.switchAuthTab = function(tab) {
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            const btnLogin = document.getElementById('tab-btn-login');
            const btnRegister = document.getElementById('tab-btn-register');
            const errorBox = document.getElementById('auth-error');

            if (errorBox) errorBox.classList.add('hidden');

            if (tab === 'login') {
                if (formLogin) formLogin.classList.remove('hidden');
                if (formRegister) formRegister.classList.add('hidden');
                if (btnLogin) btnLogin.className = 'w-1/2 py-2 border-b-2 border-blue-500 text-blue-400 transition font-semibold';
                if (btnRegister) btnRegister.className = 'w-1/2 py-2 border-b-2 border-transparent text-slate-400 transition hover:text-white font-semibold';
            } else {
                if (formLogin) formLogin.classList.add('hidden');
                if (formRegister) formRegister.classList.remove('hidden');
                if (btnRegister) btnRegister.className = 'w-1/2 py-2 border-b-2 border-blue-500 text-blue-400 transition font-semibold';
                if (btnLogin) btnLogin.className = 'w-1/2 py-2 border-b-2 border-transparent text-slate-400 transition hover:text-white font-semibold';
            }
        };

        // Firebase Configuration & Global Variables setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'xuyaanew-app-default';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDemoKeyForPublicTestingOnly",
            authDomain: "xuyaanew-demo.firebaseapp.com",
            projectId: "xuyaanew-demo",
            storageBucket: "xuyaanew-demo.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Firestore Paths (Strict Rule Adherence)
        const publicUsersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');
        const publicPostsCol = collection(db, 'artifacts', appId, 'public', 'data', 'posts');

        // State Management
        let currentUser = null;
        let allUsers = [];
        let posts = [];
        let uploadedMediaBase64 = '';
        let editAvatarBase64 = '';
        let editWallpaperBase64 = '';

        // Initialize Firebase Authentication First
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.warn("Auth fallback trigger:", err);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    checkAuthSession();
                }
            });
        });

        // Check Logged-in local session
        function checkAuthSession() {
            const savedUser = localStorage.getItem('xuyaanew_logged_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                setupRealtimeListeners();
                showMainApp();
            } else {
                showAuthScreen();
            }
        }

        // Setup Real-time Listeners for Users & Posts
        function setupRealtimeListeners() {
            // Real-time Users Listener
            onSnapshot(publicUsersCol, (snapshot) => {
                allUsers = [];
                snapshot.forEach(docSnap => {
                    allUsers.push(docSnap.data());
                });
                
                // Sync current user state if updated in cloud
                if (currentUser) {
                    const freshMe = allUsers.find(u => u.username === currentUser.username);
                    if (freshMe) {
                        currentUser = freshMe;
                        localStorage.setItem('xuyaanew_logged_user', JSON.stringify(currentUser));
                    }
                }
                updateProfileUI();
                renderStories();
            }, (error) => {
                console.error("Users listener error:", error);
            });

            // Real-time Posts Listener
            onSnapshot(publicPostsCol, (snapshot) => {
                const fetchedPosts = [];
                snapshot.forEach(docSnap => {
                    fetchedPosts.push(docSnap.data());
                });
                
                // Sort posts newest first (In-memory sorting)
                posts = fetchedPosts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                renderPosts();
                renderProfileGrid();
            }, (error) => {
                console.error("Posts listener error:", error);
            });
        }

        window.handleRegister = async function(e) {
            e.preventDefault();
            const btnSubmit = document.getElementById('btn-submit-register');
            const btnText = document.getElementById('btn-register-text');
            const fullname = document.getElementById('reg-fullname').value.trim();
            const username = document.getElementById('reg-username').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;
            const errorBox = document.getElementById('auth-error');

            if (!fullname || !username || !password) {
                errorBox.textContent = 'Semua bidang wajib diisi!';
                errorBox.classList.remove('hidden');
                return;
            }

            // Tampilkan Animasi Loading
            btnSubmit.disabled = true;
            btnText.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-lg"></i> <span>Memproses...</span>`;

            const newUser = {
                fullname: fullname,
                username: username,
                password: password,
                avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`,
                wallpaper: '',
                followers: [],
                following: []
            };

            try {
                // Coba simpan ke Cloud Database Firestore
                const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', username);
                const userSnap = await getDoc(userDocRef);

                if (userSnap.exists()) {
                    errorBox.textContent = 'Username sudah digunakan, coba username lain.';
                    errorBox.classList.remove('hidden');
                    btnSubmit.disabled = false;
                    btnText.textContent = 'Buat Akun Baru';
                    return;
                }

                await setDoc(userDocRef, newUser);
            } catch (err) {
                console.warn("Firestore save fallback to LocalStorage:", err);
            }

            // Simpan akun pengguna ke lokal storage agar login selalu berhasil
            let localUsers = JSON.parse(localStorage.getItem('xuyaanew_all_users') || '[]');
            if (localUsers.some(u => u.username === username)) {
                errorBox.textContent = 'Username sudah digunakan!';
                errorBox.classList.remove('hidden');
                btnSubmit.disabled = false;
                btnText.textContent = 'Buat Akun Baru';
                return;
            }
            localUsers.push(newUser);
            localStorage.setItem('xuyaanew_all_users', JSON.stringify(localUsers));

            localStorage.setItem('xuyaanew_logged_user', JSON.stringify(newUser));

            currentUser = newUser;
            showToast('Akun berhasil dibuat!');
            setupRealtimeListeners();
            showMainApp();
            
            btnSubmit.disabled = false;
            btnText.textContent = 'Buat Akun Baru';
        };

        window.handleLogin = async function(e) {
            e.preventDefault();
            const btnSubmit = document.getElementById('btn-submit-login');
            const btnText = document.getElementById('btn-login-text');
            const usernameInput = document.getElementById('login-username').value.trim();
            const username = usernameInput.toLowerCase();
            const password = document.getElementById('login-password').value;
            const errorBox = document.getElementById('auth-error');
            errorBox.classList.add('hidden');

            btnSubmit.disabled = true;
            btnText.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-lg"></i> <span>Masuk...</span>`;

            let foundUser = null;

            // 1. Cek dari LocalStorage terlebih dahulu (paling cepat & akurat untuk akun lokal)
            let localUsers = JSON.parse(localStorage.getItem('xuyaanew_all_users') || '[]');
            foundUser = localUsers.find(u => u.username.toLowerCase() === username && u.password === password);

            // 2. Jika tidak ada di local, cek dari Cloud Firestore
            if (!foundUser) {
                try {
                    const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', username);
                    const userSnap = await getDoc(userDocRef);
                    if (userSnap.exists()) {
                        const data = userSnap.data();
                        if (data.password === password) {
                            foundUser = data;
                        }
                    }
                } catch (err) {
                    console.warn("Firestore login lookup error:", err);
                }
            }

            if (foundUser) {
                currentUser = foundUser;
                localStorage.setItem('xuyaanew_logged_user', JSON.stringify(currentUser));
                showToast('Berhasil masuk!');
                setupRealtimeListeners();
                showMainApp();
            } else {
                errorBox.textContent = 'Username atau kata sandi salah / akun belum terdaftar!';
                errorBox.classList.remove('hidden');
            }

            btnSubmit.disabled = false;
            btnText.textContent = 'Masuk';
        };

        window.handleLogout = function() {
            localStorage.removeItem('xuyaanew_logged_user');
            currentUser = null;
            showToast('Berhasil keluar.');
            showAuthScreen();
        };

        function showAuthScreen() {
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('app').classList.add('hidden');
            document.getElementById('app').classList.remove('flex');
        }

        function showMainApp() {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('app').classList.add('flex');

            updateProfileUI();
            renderStories();
            renderPosts();
            renderProfileGrid();
        }

        function updateProfileUI() {
            if (!currentUser) return;
            document.getElementById('nav-user-avatar').src = currentUser.avatar;
            document.getElementById('mob-nav-avatar').src = currentUser.avatar;
            document.getElementById('profile-user-avatar').src = currentUser.avatar;
            document.getElementById('profile-fullname').textContent = currentUser.fullname;
            document.getElementById('profile-username').textContent = '@' + currentUser.username;
            
            document.getElementById('profile-followers-count').textContent = currentUser.followers ? currentUser.followers.length : 0;
            document.getElementById('profile-following-count').textContent = currentUser.following ? currentUser.following.length : 0;

            // Update Status Verified & Badge
            const verifiedIcon = document.getElementById('profile-verified-icon');
            const badgeTag = document.getElementById('profile-badge');

            if (currentUser.isVerified) {
                verifiedIcon.classList.remove('hidden');
            } else {
                verifiedIcon.classList.add('hidden');
            }

            if (currentUser.badge) {
                badgeTag.textContent = currentUser.badge;
                badgeTag.classList.remove('hidden');
            } else {
                badgeTag.classList.add('hidden');
            }

            const wallpaperImg = document.getElementById('profile-wallpaper');
            if (currentUser.wallpaper) {
                wallpaperImg.src = currentUser.wallpaper;
                wallpaperImg.classList.remove('hidden');
            } else {
                wallpaperImg.classList.add('hidden');
            }
        }

        window.viewUserProfile = function(username) {
            const targetUser = allUsers.find(u => u.username === username);
            if (!targetUser) return;

            if (currentUser && targetUser.username === currentUser.username) {
                switchTab('profile');
                return;
            }

            document.getElementById('tab-feed').classList.add('hidden');
            document.getElementById('tab-search').classList.add('hidden');
            document.getElementById('tab-profile').classList.add('hidden');
            document.getElementById('tab-user-detail').classList.remove('hidden');

            document.getElementById('detail-user-avatar').src = targetUser.avatar;
            document.getElementById('detail-fullname').textContent = targetUser.fullname;
            document.getElementById('detail-username').textContent = '@' + targetUser.username;
            document.getElementById('detail-followers-count').textContent = targetUser.followers ? targetUser.followers.length : 0;
            document.getElementById('detail-following-count').textContent = targetUser.following ? targetUser.following.length : 0;

            // Verified Icon & Badge Pengguna Lain
            const detailVerified = document.getElementById('detail-verified-icon');
            const detailBadge = document.getElementById('detail-badge');

            if (targetUser.isVerified) {
                detailVerified.classList.remove('hidden');
            } else {
                detailVerified.classList.add('hidden');
            }

            if (targetUser.badge) {
                detailBadge.textContent = targetUser.badge;
                detailBadge.classList.remove('hidden');
            } else {
                detailBadge.classList.add('hidden');
            }

            const wall = document.getElementById('detail-wallpaper');
            if (targetUser.wallpaper) {
                wall.src = targetUser.wallpaper;
                wall.classList.remove('hidden');
            } else {
                wall.classList.add('hidden');
            }

            const isFollowing = targetUser.followers && currentUser && targetUser.followers.includes(currentUser.username);
            const followBtn = document.getElementById('detail-follow-btn');
            followBtn.textContent = isFollowing ? 'Mengikuti' : 'Ikuti';
            followBtn.className = isFollowing 
                ? 'px-5 py-2 rounded-xl font-bold text-xs bg-slate-800 text-slate-300 border border-slate-700 transition'
                : 'px-5 py-2 rounded-xl font-bold text-xs bg-blue-600 hover:bg-blue-500 text-white shadow-md shadow-blue-500/30 transition';
            followBtn.setAttribute('onclick', `toggleFollow('${targetUser.username}')`);

            const targetPosts = posts.filter(p => p.authorUsername === targetUser.username);
            document.getElementById('detail-posts-count').textContent = targetPosts.length;
            const grid = document.getElementById('detail-posts-grid');

            if (targetPosts.length === 0) {
                grid.innerHTML = `<div class="col-span-3 py-12 text-center text-slate-500"><i class="fa-solid fa-camera text-4xl mb-2 text-blue-500/50"></i><p class="text-sm">Belum ada postingan.</p></div>`;
            } else {
                grid.innerHTML = targetPosts.map(p => `
                    <div class="relative group aspect-square overflow-hidden bg-black cursor-pointer border border-slate-900">
                        ${p.mediaType === 'video' ? `
                            <div class="relative w-full h-full flex items-center justify-center bg-slate-950">
                                <i class="fa-solid fa-play text-2xl text-blue-400 z-10"></i>
                                <video class="absolute inset-0 w-full h-full object-cover opacity-60"><source src="${p.mediaUrl}"></video>
                            </div>
                        ` : `
                            <img src="${p.mediaUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="Post">
                        `}
                    </div>
                `).join('');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.openEditProfileModal = function() {
            document.getElementById('edit-fullname').value = currentUser.fullname || '';
            document.getElementById('edit-avatar-url').value = currentUser.avatar && currentUser.avatar.startsWith('http') && !currentUser.avatar.startsWith('data') ? currentUser.avatar : '';
            document.getElementById('edit-wallpaper-url').value = currentUser.wallpaper && currentUser.wallpaper.startsWith('http') && !currentUser.wallpaper.startsWith('data') ? currentUser.wallpaper : '';
            document.getElementById('edit-is-verified').checked = Boolean(currentUser.isVerified);
            document.getElementById('edit-user-badge').value = currentUser.badge || '';

            editAvatarBase64 = '';
            editWallpaperBase64 = '';
            document.getElementById('modal-edit-profile').classList.remove('hidden');
        };

        window.closeEditProfileModal = function() {
            document.getElementById('modal-edit-profile').classList.add('hidden');
        };

        // Single clean handleUpdateProfile function with full badge & photo support
        window.handleUpdateProfile = async function(e) {
            e.preventDefault();
            if (!currentUser) return;

            const newFullname = document.getElementById('edit-fullname').value.trim();
            const avatarUrlInput = document.getElementById('edit-avatar-url').value.trim();
            const wallpaperUrlInput = document.getElementById('edit-wallpaper-url').value.trim();
            const isVerified = document.getElementById('edit-is-verified').checked;
            const badge = document.getElementById('edit-user-badge').value;

            // Prioritaskan file lokal yang dikompres, lalu URL input, lalu gambar lama
            const finalAvatar = editAvatarBase64 || avatarUrlInput || currentUser.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${currentUser.username}`;
            const finalWallpaper = editWallpaperBase64 || wallpaperUrlInput || currentUser.wallpaper || '';

            // Update state lokal pengguna secara lengkap
            currentUser.fullname = newFullname || currentUser.fullname;
            currentUser.avatar = finalAvatar;
            currentUser.wallpaper = finalWallpaper;
            currentUser.isVerified = isVerified;
            currentUser.badge = badge;

            // Simpan ke LocalStorage agar perubahan profil & centang biru langsung aktif
            localStorage.setItem('xuyaanew_logged_user', JSON.stringify(currentUser));
            
            let localUsers = JSON.parse(localStorage.getItem('xuyaanew_all_users') || '[]');
            const userIdx = localUsers.findIndex(u => u.username === currentUser.username);
            if (userIdx !== -1) {
                localUsers[userIdx] = currentUser;
            } else {
                localUsers.push(currentUser);
            }
            localStorage.setItem('xuyaanew_all_users', JSON.stringify(localUsers));

            try {
                // Simpan juga ke Cloud Firestore secara sync
                const myUserRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.username);
                await setDoc(myUserRef, {
                    fullname: currentUser.fullname,
                    username: currentUser.username,
                    avatar: finalAvatar,
                    wallpaper: finalWallpaper,
                    isVerified: isVerified,
                    badge: badge,
                    followers: currentUser.followers || [],
                    following: currentUser.following || []
                }, { merge: true });
            } catch (err) {
                console.warn("Update cloud profil fallback:", err);
            }

            // Perbarui tampilan UI & Feed seketika
            updateProfileUI();
            renderPosts();
            renderProfileGrid();
            closeEditProfileModal();
            showToast('Profil & Lencana Centang Biru berhasil diperbarui!');
        };

        // Improved Image Compression Helper supporting .jfif, .webp, .png, .jpg
        function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > maxWidth) {
                                    height = Math.round((height * maxWidth) / width);
                                    width = maxWidth;
                                }
                            } else {
                                if (height > maxHeight) {
                                    width = Math.round((width * maxHeight) / height);
                                    height = maxHeight;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', quality));
                        } catch (err) {
                            resolve(e.target.result);
                        }
                    };
                    img.onerror = () => {
                        resolve(e.target.result);
                    };
                    img.src = e.target.result;
                };
                reader.onerror = () => resolve('');
                reader.readAsDataURL(file);
            });
        }

        window.handleAvatarFileSelect = async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                editAvatarBase64 = await compressImage(file, 300, 300, 0.7);
                showToast('Foto profil berhasil dimuat!');
            } catch (err) {
                console.error("Avatar compression failed:", err);
            }
        };

        window.handleWallpaperFileSelect = async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                editWallpaperBase64 = await compressImage(file, 800, 400, 0.7);
                showToast('Wallpaper berhasil dimuat!');
            } catch (err) {
                console.error("Wallpaper compression failed:", err);
            }
        };

        window.handleFileSelect = async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const previewBox = document.getElementById('post-media-preview-box');
            const previewImg = document.getElementById('post-preview-img');
            const previewVideo = document.getElementById('post-preview-video');
            const mediaType = document.getElementById('post-media-type').value;

            previewBox.classList.remove('hidden');
            if (file.type.startsWith('image') || mediaType === 'image') {
                try {
                    // Kompresi super cepat & ringan (maksimal 600px, kualitas 0.55 agar instan)
                    uploadedMediaBase64 = await compressImage(file, 600, 600, 0.55);
                    previewImg.src = uploadedMediaBase64;
                    previewImg.classList.remove('hidden');
                    previewVideo.classList.add('hidden');
                } catch (err) {
                    console.error("Image post compression failed:", err);
                }
            } else {
                const reader = new FileReader();
                reader.onload = (event) => {
                    uploadedMediaBase64 = event.target.result;
                    previewVideo.src = uploadedMediaBase64;
                    previewVideo.classList.remove('hidden');
                    previewImg.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        window.handleUrlInput = function(e) {
            const url = e.target.value.trim();
            const previewBox = document.getElementById('post-media-preview-box');
            const previewImg = document.getElementById('post-preview-img');
            const previewVideo = document.getElementById('post-preview-video');
            const mediaType = document.getElementById('post-media-type').value;

            if (!url) {
                if (!uploadedMediaBase64) previewBox.classList.add('hidden');
                return;
            }

            previewBox.classList.remove('hidden');
            if (mediaType === 'video') {
                previewVideo.src = url;
                previewVideo.classList.remove('hidden');
                previewImg.classList.add('hidden');
            } else {
                previewImg.src = url;
                previewImg.classList.remove('hidden');
                previewVideo.classList.add('hidden');
            }
        };

        window.toggleMediaInputType = function() {
            const mediaType = document.getElementById('post-media-type').value;
            const fileInput = document.getElementById('post-file-input');
            if (mediaType === 'video') {
                fileInput.accept = 'video/*';
            } else {
                fileInput.accept = 'image/*';
            }
        };

        window.openCreatePostModal = function() {
            document.getElementById('modal-create-post').classList.remove('hidden');
        };

        window.closeCreatePostModal = function() {
            document.getElementById('modal-create-post').classList.add('hidden');
            document.getElementById('form-create-post').reset();
            document.getElementById('post-media-preview-box').classList.add('hidden');
            uploadedMediaBase64 = '';
        };

        window.handleCreatePost = async function(e) {
            e.preventDefault();
            if (!currentUser) return;

            const btnSubmit = document.getElementById('btn-submit-post');
            const btnText = document.getElementById('btn-post-text');
            const caption = document.getElementById('post-caption').value.trim();
            const mediaType = document.getElementById('post-media-type').value;
            const mediaUrlInput = document.getElementById('post-media-url').value.trim();

            const mediaUrl = uploadedMediaBase64 || mediaUrlInput;

            if (!mediaUrl) {
                showToast('Harap sertakan file foto/video atau masukkan URL!');
                return;
            }

            // Langsung tutup modal dan tampilkan postingan secara instan (Zero Delay)
            const postId = 'post_' + Date.now();
            const newPost = {
                id: postId,
                authorName: currentUser.fullname,
                authorUsername: currentUser.username,
                authorAvatar: currentUser.avatar,
                caption: caption,
                mediaType: mediaType,
                mediaUrl: mediaUrl,
                likes: 0,
                likedBy: [],
                comments: [],
                createdAt: Date.now(),
                timestamp: 'Baru saja'
            };

            posts.unshift(newPost);
            renderPosts();
            renderProfileGrid();
            closeCreatePostModal();
            showToast('Postingan berhasil dibagikan secara instan!');

            // Sinkronisasi cloud berjalan di background tanpa mengunci UI
            try {
                const postRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', postId);
                setDoc(postRef, newPost).catch(err => console.warn("Background sync warning:", err));
            } catch (err) {
                console.warn("Firestore post save fallback:", err);
            }
        };

        window.switchTab = function(tabName) {
            document.getElementById('tab-feed').classList.add('hidden');
            document.getElementById('tab-search').classList.add('hidden');
            document.getElementById('tab-profile').classList.add('hidden');
            document.getElementById('tab-user-detail').classList.add('hidden');

            const selectedTab = document.getElementById(`tab-${tabName}`);
            if (selectedTab) selectedTab.classList.remove('hidden');

            if (tabName === 'profile') {
                updateProfileUI();
                renderProfileGrid();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.showToast = function(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            if (!toast || !toastMessage) return;

            toastMessage.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
            }, 3000);
        };
    </script>
</body>
</html>
